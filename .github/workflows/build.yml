name: Build GlideBrowser
on: [workflow_dispatch]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      # setup-android's default packages include the retired `tools` package,
      # which sdkmanager has refused since 2026-09-15 (run #1 failed here in 10s).
      # Install the platform + build-tools explicitly: gradle.properties has no
      # android.builder.sdkDownload=true, so Gradle cannot be relied on to
      # download them itself.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      # gradlew loses its exec bit when uploaded via the GitHub web UI.
      - run: chmod +x gradlew
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.GLIDEBROWSER_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > androidApp/release.keystore
      - run: ./gradlew :androidApp:assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: androidApp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.GLIDEBROWSER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GLIDEBROWSER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GLIDEBROWSER_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with: { name: GlideBrowser-android, path: androidApp/build/outputs/apk/release/ }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      # jpackage needs WiX 3.x to build the .msi — install it explicitly.
      - run: choco install wixtoolset -y
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :desktopApp:packageMsi --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: GlideBrowser-windows, path: desktopApp/build/compose/binaries/main/msi/ }
